# Railway deploy config (single service serving frontend + backend).
# - Build steps: install root deps -> build frontend -> install server deps -> prisma generate -> build server
# - Start: Node bootstraps DATABASE_URL from MYSQL_URL, then prisma db push, then serves app
# - The compiled server serves the built frontend as static files in production
# - Health check at /api/health (returns 200 once DB is up)

[build]
builder = "NIXPACKS"
# Dummy DATABASE_URL only for prisma generate at build time (no DB connection needed).
buildCommand = "npm install && npm run build && cd server && npm install && DATABASE_URL=mysql://build:build@127.0.0.1:3306/build npx prisma generate && npm run build"

[deploy]
startCommand = "cd server && node dist/index.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/api/health"
healthcheckTimeout = 120

[deploy.variables]
RAILPACK_NODE_VERSION = "22"
